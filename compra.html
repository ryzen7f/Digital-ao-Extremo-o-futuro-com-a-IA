<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compra do curso</title>
    <style>
        html {
            margin: 0;
            padding: 0;
        }
        body {
            padding: 0;
            margin: 0;
        }
        .compra {
    border: solid 1px;
    min-height: 100vh;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background-image: url(compra.png);
}


.campo-compra {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 85%;
}

.campo-compra p {
    text-align: center;
}

form {
    height: 90vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    width: 37%;
    background-color: rgba(227, 234, 233, 0.925);
    border-radius: 10px;
}

form label {
    text-align: start;
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
}

form input {
    border-radius: 7px;
    height: 4%;
    width: 85%;
}

form p {
    text-align: start;
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
}

.forma-pagamento {
    border-radius: 7px;
    height: 6%;
    width: 85%;
    border: transparent;
    margin-bottom: 10px;
    font-weight: bold;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 18px;
    background-color: rgb(237, 247, 255);
    display: flex;
    align-items: center;
}

.forma-pagamento:hover {
    border: solid 2px green;
    cursor: pointer;
}

.forma-pagamento input {
    width: 18%;
    height: 18%;
}

.confirmar {
    background-color: green;
    width: 85%;
    height: 5%;
    border: none;
    background-color: rgb(95, 255, 47);
    border-radius: 25px;
    cursor: pointer;
}
@media (max-width: 680px) {
    .compra {
        min-height: 100vh;
    }

    .campo-compra {
        width: 100%;
    }

    form {
        width: 100%;
    }

    .sobrenos {
        display: flex;
        flex-direction: column;
    }
}
    </style>
</head>
<body>
    <main>
    <section class="compra" id="compra">
    <div class="campo-compra">
        <form action="">
            <label for="email">Insira seu e-mail</label><br>
            <input type="email" id="email" name="email" required><br>

            <label for="senha">Senha</label><br>
            <input type="password" id="senha" name="senha" required><br>

            <label for="cpf">Insira seu cpf</label><br>
            <input type="text" id="cpf" name="cpf" required><br>

            <label>Forma de pagamento</label>
            <label class="forma-pagamento">
                <input type="radio" id="cartao" name="pagamento" value="cartao">
                💳 Cartão de Crédito (até 12x sem juros)
            </label>

            <label class="forma-pagamento">
                <input type="radio" id="pix" name="pagamento" value="pix">
                📱 PIX (10% de desconto)
            </label>

            <label class="forma-pagamento">
                <input type="radio" id="boleto" name="pagamento" value="boleto">
                🧾 Boleto Bancário
            </label>

            <label class="forma-pagamento">
                <input type="radio" id="assinatura" name="pagamento" value="assinatura">
                💰 Assinatura Mensal
            </label>

            <button class="confirmar" type="submit">Confirmar</button>

            <p> Seu nome de perfil não será compartilhado. Nunca envie senhas.</p>
        </form>
    </div>
</section>
</main>
</body>
</html>
